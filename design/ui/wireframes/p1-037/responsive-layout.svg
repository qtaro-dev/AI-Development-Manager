<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">P1-037 レスポンシブ配置判断</title>
  <desc id="desc">1440px、820px、320px相当で主要操作を保持する配置比較</desc>
  <rect width="1440" height="820" fill="#eef1f6"/>
  <text x="40" y="48" fill="#172033" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">P1-037 配置判断 — 主要操作を幅・DPIに関係なく保持</text>
  <g transform="translate(40 88)"><text x="0" y="0" fill="#536078" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">1440px相当 / 標準</text><rect y="20" width="560" height="330" rx="10" fill="#fff" stroke="#aeb9cb"/><rect x="0" y="20" width="142" height="330" fill="#172033"/><rect x="142" y="20" width="418" height="45" fill="#f8f9fc"/><rect x="166" y="88" width="370" height="180" rx="8" fill="#f2f6ff"/><text x="190" y="124" fill="#172033" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">本文領域</text><rect x="190" y="220" width="112" height="32" rx="5" fill="#2457c5"/><text x="246" y="241" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="12">主操作</text><text x="166" y="318" fill="#536078" font-family="Segoe UI, sans-serif" font-size="13">sidebar 248px / topbar 71px</text></g>
  <g transform="translate(640 88)"><text x="0" y="0" fill="#536078" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">820px相当 / 狭幅</text><rect y="20" width="360" height="330" rx="10" fill="#fff" stroke="#aeb9cb"/><rect x="0" y="20" width="54" height="330" fill="#172033"/><rect x="54" y="20" width="306" height="45" fill="#f8f9fc"/><rect x="78" y="88" width="258" height="180" rx="8" fill="#f2f6ff"/><text x="96" y="124" fill="#172033" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">本文1列</text><rect x="96" y="220" width="112" height="32" rx="5" fill="#2457c5"/><text x="152" y="241" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="12">主操作</text><text x="78" y="318" fill="#536078" font-family="Segoe UI, sans-serif" font-size="13">icon rail 64px / 操作を隠さない</text></g>
  <g transform="translate(1040 88)"><text x="0" y="0" fill="#536078" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">320px相当 / 最小</text><rect y="20" width="220" height="330" rx="10" fill="#fff" stroke="#aeb9cb"/><rect x="0" y="20" width="40" height="330" fill="#172033"/><rect x="40" y="20" width="180" height="45" fill="#f8f9fc"/><rect x="56" y="88" width="148" height="180" rx="8" fill="#f2f6ff"/><text x="70" y="124" fill="#172033" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">本文</text><rect x="70" y="220" width="112" height="32" rx="5" fill="#2457c5"/><text x="126" y="241" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="12">主操作</text><text x="56" y="318" fill="#536078" font-family="Segoe UI, sans-serif" font-size="13">横スクロールを避ける</text></g>
  <rect x="40" y="500" width="1360" height="230" rx="12" fill="#fff" stroke="#d6dce8"/>
  <text x="72" y="548" fill="#172033" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700">100～200% DPIの判断基準</text>
  <text x="72" y="584" fill="#536078" font-family="Segoe UI, sans-serif" font-size="16">文字・ボタンは縮小せず、本文を縦に流して主操作を保持する。説明文は折り返し、操作領域は44px相当以上を確保する。</text>
  <text x="72" y="620" fill="#536078" font-family="Segoe UI, sans-serif" font-size="16">優先順位: このPCで続ける / もう一度試す → 接続先を設定 → 終了。診断情報は主操作を押し下げない。</text>
  <text x="72" y="666" fill="#536078" font-family="Segoe UI, sans-serif" font-size="16">確認対象: 切れ、重なり、フォーカス表示、Tab順、Escape、Enter、狭幅での戻る操作。</text>
</svg>
