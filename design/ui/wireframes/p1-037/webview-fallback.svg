<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">P1-037 Web UI読込失敗時のWPF fallback</title>
  <desc id="desc">組み込み画面を読めない場合に理由と復帰操作を示す画面</desc>
  <rect width="960" height="640" fill="#eef1f6"/><rect width="960" height="64" fill="#172033"/>
  <text x="32" y="40" fill="#fff" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700">AI Development Manager</text>
  <rect x="32" y="104" width="896" height="456" rx="16" fill="#fff" stroke="#d6dce8"/>
  <circle cx="112" cy="184" r="34" fill="#fff0ed"/><path d="M112 164v25m0 12v4" stroke="#c83b32" stroke-width="7" stroke-linecap="round"/>
  <text x="176" y="178" fill="#172033" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700">画面を読み込めません</text>
  <text x="176" y="214" fill="#536078" font-family="Segoe UI, sans-serif" font-size="17">アプリの画面を準備できませんでした。設定や再読込を試せます。</text>
  <rect x="80" y="274" width="800" height="96" rx="10" fill="#f8f9fc" stroke="#d6dce8"/>
  <text x="108" y="310" fill="#172033" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">考えられる原因</text>
  <text x="108" y="340" fill="#536078" font-family="Segoe UI, sans-serif" font-size="15">アプリの配布物が不足しているか、画面の準備に時間がかかっています。</text>
  <rect x="80" y="420" width="172" height="56" rx="8" fill="#2457c5"/><text x="166" y="455" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">もう一度読み込む</text>
  <rect x="272" y="420" width="164" height="56" rx="8" fill="#fff" stroke="#aeb9cb"/><text x="354" y="455" text-anchor="middle" fill="#24324a" font-family="Segoe UI, sans-serif" font-size="16">設定を確認</text>
  <rect x="456" y="420" width="100" height="56" rx="8" fill="#fff" stroke="#aeb9cb"/><text x="506" y="455" text-anchor="middle" fill="#24324a" font-family="Segoe UI, sans-serif" font-size="16">終了</text>
  <text x="80" y="520" fill="#536078" font-family="Segoe UI, sans-serif" font-size="14">専門的なエラー情報は診断用に分離し、利用者向け案内には表示しない</text>
</svg>
