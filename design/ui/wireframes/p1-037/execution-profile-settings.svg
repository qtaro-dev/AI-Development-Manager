<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">P1-037 実行プロファイル設定</title>
  <desc id="desc">このPCで利用するLocalとLAN Serverへ接続するServerを選ぶ設定画面</desc>
  <rect width="1100" height="700" fill="#f5f7fb"/><rect width="1100" height="72" fill="#172033"/>
  <text x="32" y="45" fill="#fff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">設定</text>
  <rect x="32" y="104" width="1036" height="532" rx="16" fill="#fff" stroke="#d6dce8"/>
  <text x="72" y="160" fill="#172033" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700">利用方法</text>
  <text x="72" y="194" fill="#536078" font-family="Segoe UI, sans-serif" font-size="16">いつでもLocalへ戻せます。Serverを選んだ場合だけ接続先を保存します。</text>
  <rect x="72" y="236" width="440" height="154" rx="12" fill="#f2f6ff" stroke="#2457c5" stroke-width="2"/>
  <circle cx="108" cy="276" r="12" fill="#2457c5"/><circle cx="108" cy="276" r="5" fill="#fff"/>
  <text x="140" y="284" fill="#172033" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700">このPCで利用</text>
  <text x="100" y="326" fill="#536078" font-family="Segoe UI, sans-serif" font-size="15">サーバーなしでローカルのデータを管理します。</text>
  <text x="100" y="354" fill="#536078" font-family="Segoe UI, sans-serif" font-size="15">既定の利用方法です。</text>
  <rect x="544" y="236" width="440" height="154" rx="12" fill="#fff" stroke="#aeb9cb"/>
  <circle cx="580" cy="276" r="12" fill="#fff" stroke="#8190a8" stroke-width="2"/>
  <text x="612" y="284" fill="#172033" font-family="Segoe UI, sans-serif" font-size="19" font-weight="700">LAN Serverへ接続</text>
  <text x="572" y="326" fill="#536078" font-family="Segoe UI, sans-serif" font-size="15">HTTPSの接続先を指定して共有機能を利用します。</text>
  <text x="572" y="354" fill="#536078" font-family="Segoe UI, sans-serif" font-size="15">パスワードや秘密鍵は保存しません。</text>
  <text x="72" y="446" fill="#172033" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">Server URL</text>
  <rect x="72" y="466" width="912" height="52" rx="8" fill="#eef1f6" stroke="#cbd2df"/><text x="92" y="500" fill="#8a95a8" font-family="Segoe UI, sans-serif" font-size="16">Local選択中は入力できません（Server選択時に表示）</text>
  <text x="72" y="548" fill="#536078" font-family="Segoe UI, sans-serif" font-size="14">Server URLは「LAN Serverへ接続」を選んだ場合だけ有効になります。HTTPSのみ保存できます。</text>
  <rect x="752" y="568" width="104" height="48" rx="8" fill="#fff" stroke="#aeb9cb"/><text x="804" y="598" text-anchor="middle" fill="#24324a" font-family="Segoe UI, sans-serif" font-size="16">取消</text>
  <rect x="872" y="568" width="112" height="48" rx="8" fill="#2457c5"/><text x="928" y="598" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">保存</text>
</svg>
