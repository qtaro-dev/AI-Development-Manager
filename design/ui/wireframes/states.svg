<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Development Manager state wireframes</title><desc id="desc">保存、競合、アップロード、容量警告、エラー、復元状態の仮ワイヤーフレーム</desc>
  <style>text{font-family:'Segoe UI','Noto Sans JP',sans-serif;fill:#172136}.muted{fill:#7b8496}.surface{fill:#fff;stroke:#e6e9f0}.soft{fill:#f9fafc;stroke:#e6e9f0}.primary{fill:#5964d9}.danger{fill:#d6575d}.warn{fill:#b97918}.success{fill:#2d9d70}.white{fill:#fff}</style>
  <rect width="1200" height="760" fill="#f6f7fb"/><text x="48" y="55" font-size="24" font-weight="700">状態別ワイヤーフレーム</text><text x="48" y="80" class="muted" font-size="12">状態は色・文言・次の操作を組み合わせ、色だけで意味を伝えない。</text>
  <g transform="translate(48 115)"><rect width="340" height="180" rx="12" class="surface"/><circle cx="31" cy="37" r="10" fill="#e8f7f0"/><text x="51" y="42" class="success" font-size="13" font-weight="700">保存済み</text><text x="24" y="78" font-size="16" font-weight="700">変更は保存されています</text><text x="24" y="105" class="muted" font-size="11">最終保存 2026-08-02 11:24</text><rect x="24" y="130" width="110" height="32" rx="7" class="soft"/><text x="79" y="151" text-anchor="middle" font-size="10">編集する</text></g>
  <g transform="translate(430 115)"><rect width="340" height="180" rx="12" class="surface"/><circle cx="31" cy="37" r="10" fill="#fff0f0"/><text x="51" y="42" class="danger" font-size="13" font-weight="700">競合を確認</text><text x="24" y="78" font-size="16" font-weight="700">他の変更と競合しました</text><text x="24" y="105" class="muted" font-size="11">最新版・自分の変更・差分を比較できます。</text><rect x="24" y="130" width="134" height="32" rx="7" class="soft"/><text x="91" y="151" text-anchor="middle" font-size="10">差分を表示</text><rect x="168" y="130" width="140" height="32" rx="7" class="primary"/><text x="238" y="151" text-anchor="middle" class="white" font-size="10">最新版を使う</text></g>
  <g transform="translate(812 115)"><rect width="340" height="180" rx="12" class="surface"/><circle cx="31" cy="37" r="10" fill="#fff5df"/><text x="51" y="42" class="warn" font-size="13" font-weight="700">アップロード中</text><text x="24" y="78" font-size="16" font-weight="700">poc-result.json</text><text x="24" y="105" class="muted" font-size="11">64%　12 KB / 18 KB</text><rect x="24" y="121" width="292" height="8" rx="4" fill="#e6e9f0"/><rect x="24" y="121" width="187" height="8" rx="4" class="primary"/><rect x="24" y="143" width="82" height="25" rx="6" class="soft"/><text x="65" y="160" text-anchor="middle" font-size="9">取消</text></g>
  <g transform="translate(48 345)"><rect width="340" height="180" rx="12" class="surface"/><circle cx="31" cy="37" r="10" fill="#fff5df"/><text x="51" y="42" class="warn" font-size="13" font-weight="700">容量警告</text><text x="24" y="78" font-size="16" font-weight="700">保存領域の使用量が80%</text><text x="24" y="105" class="muted" font-size="11">整理候補を確認してください。</text><rect x="24" y="130" width="125" height="32" rx="7" class="primary"/><text x="86" y="151" text-anchor="middle" class="white" font-size="10">候補を確認</text></g>
  <g transform="translate(430 345)"><rect width="340" height="180" rx="12" class="surface"/><circle cx="31" cy="37" r="10" fill="#fff0f0"/><text x="51" y="42" class="danger" font-size="13" font-weight="700">保存できません</text><text x="24" y="78" font-size="16" font-weight="700">保存先を確認してください</text><text x="24" y="105" class="muted" font-size="11">安全な保存先か、アクセス権を確認してください。</text><text x="24" y="137" class="muted" font-size="10">追跡ID: ADM-ERR-024</text><rect x="24" y="150" width="83" height="24" rx="6" class="soft"/><text x="65" y="166" text-anchor="middle" font-size="9">再試行</text></g>
  <g transform="translate(812 345)"><rect width="340" height="180" rx="12" class="surface"/><circle cx="31" cy="37" r="10" fill="#eef0ff"/><text x="51" y="42" class="primary" font-size="13" font-weight="700">復元を検証中</text><text x="24" y="78" font-size="16" font-weight="700">世代20を確認しています</text><text x="24" y="105" class="muted" font-size="11">manifestと内容ハッシュを検証します。</text><rect x="24" y="130" width="292" height="8" rx="4" fill="#e6e9f0"/><rect x="24" y="130" width="116" height="8" rx="4" class="primary"/><rect x="24" y="150" width="65" height="24" rx="6" class="soft"/><text x="56" y="166" text-anchor="middle" font-size="9">取消</text></g>
</svg>
